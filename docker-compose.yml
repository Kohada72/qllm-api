services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env

  gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    volumes:
      - ./gui:/app
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - api